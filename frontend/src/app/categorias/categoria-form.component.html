<div class="form-container">
  <div class="header">
    <h2>{{ isEditMode ? 'Editar' : 'Nueva' }} Categoría</h2>
    <button mat-button routerLink="/categorias">
      <mat-icon>arrow_back</mat-icon>
      Volver
    </button>
  </div>

  <form [formGroup]="categoriaForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="form-field">
      <mat-label>Nombre *</mat-label>
      <input matInput formControlName="nombre" placeholder="Nombre de la categoría">
      <mat-error *ngIf="categoriaForm.get('nombre')?.hasError('required')">
        El nombre es obligatorio
      </mat-error>
      <mat-error *ngIf="categoriaForm.get('nombre')?.hasError('minlength')">
        El nombre debe tener al menos 3 caracteres
      </mat-error>
      <mat-error *ngIf="categoriaForm.get('nombre')?.hasError('maxlength')">
        El nombre no puede exceder 60 caracteres
      </mat-error>
    </mat-form-field>

    <mat-form-field class="form-field">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" placeholder="Descripción de la categoría" rows="3"></textarea>
    </mat-form-field>

    <div class="actions">
      <button mat-button type="button" routerLink="/categorias">Cancelar</button>
      <button mat-raised-button color="primary" type="submit" [disabled]="categoriaForm.invalid || isSubmitting">
        <mat-icon *ngIf="!isSubmitting">{{ isEditMode ? 'save' : 'add' }}</mat-icon>
        <span *ngIf="isSubmitting">Guardando...</span>
        <span *ngIf="!isSubmitting">{{ isEditMode ? 'Guardar' : 'Crear' }}</span>
      </button>
    </div>
  </form>
</div>
