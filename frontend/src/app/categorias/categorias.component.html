<div class="header">
  <h2>Gestión de Categorías</h2>
  <button mat-raised-button color="primary" routerLink="/categorias/nueva">
    <mat-icon>add</mat-icon>
    Nueva Categoría
  </button>
</div>

<div class="search-container">
  <mat-form-field class="search-field">
    <mat-label>Buscar</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Buscar por nombre...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <mat-form-field class="status-field">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="statusControl">
      <mat-option value="">Todos</mat-option>
      <mat-option [value]="true">Activo</mat-option>
      <mat-option [value]="false">Inactivo</mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div class="table-container">
  <table mat-table [dataSource]="categorias" matSort>
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let categoria">{{ categoria.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let categoria">{{ categoria.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let categoria">{{ categoria.descripcion || '-' }}</td>
    </ng-container>

    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let categoria">
        <mat-chip [color]="categoria.activo ? 'accent' : 'warn'" selected>
          {{ categoria.activo ? 'Activo' : 'Inactivo' }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let categoria">
        <button mat-icon-button [routerLink]="['/categorias', categoria.id]" matTooltip="Editar">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="toggleActivo(categoria)" 
                [matTooltip]="categoria.activo ? 'Desactivar' : 'Activar'">
          <mat-icon>{{ categoria.activo ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteCategoria(categoria.id!)" matTooltip="Eliminar">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25, 50]"
                 (page)="onPageChange($event)">
  </mat-paginator>
</div>
